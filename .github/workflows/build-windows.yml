name: Build Windows app

# Every push builds and tests the installer.
# Releases publish themselves: when main has a package.json version with no
# GitHub Release yet, this workflow creates the vX.Y.Z tag + release and
# attaches the installer and update manifest. (Pushing a vX.Y.Z tag works too.)
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run dist

      - name: Check the update manifest was built
        shell: bash
        run: test -f dist/latest.yml && cat dist/latest.yml

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: FocusPoint-Setup
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: Decide whether to publish a release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "v$version has no release yet: publishing it."
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Focus Point ${{ steps.release.outputs.version }}
          generate_release_notes: true
          # latest.yml + .blockmap let installed copies find and download this update
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
